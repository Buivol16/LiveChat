services:

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: livechat
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

  keycloak:
    image: keycloak/keycloak:26.4
    restart: no
    ports:
      - "6060:8080"
    environment:
      - "KC_BOOTSTRAP_ADMIN_USERNAME=admin"
      - "KC_BOOTSTRAP_ADMIN_PASSWORD=admin"
    command:
      - start-dev

  config-service:
    image: config-server:0.0.1-SNAPSHOT
    restart: no
    ports:
      - "8888:8888"
    networks:
      backend:
        aliases:
          - "configserver"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://discovery:8761/eureka"

  discovery-service:
    image: discovery-service:0.0.1-SNAPSHOT
    restart: no
    ports:
      - "8761:8761"
    networks:
      backend:
        aliases:
          - "discovery"
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8888"

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false

  kafka-ui:
    image: kafbat/kafka-ui:main
    ports:
      - "8020:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      - kafka

networks:
  backend:
    driver: bridge