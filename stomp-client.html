    function disconnect() {

    function sendMessage() {
        if (!stompClient || !stompClient.connected) {
            log("Client is not connected");
            return;
        }

        const message = document.getElementById("messageInput").value;

        stompClient.publish({
            destination: "/app/test",
            body: message
