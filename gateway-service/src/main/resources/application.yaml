spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:6060
  config:
    import: configserver:http://localhost:8888
  main:
    web-application-type: REACTIVE
management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'
eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true

