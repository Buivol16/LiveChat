spring:
  application:
    name: message-service
  config:
    import: configserver:http://localhost:8888
  cloud:
    stream:
      kafka:
        binder:
          autoCreateTopics: false
      bindings:
        message-created-out-0:
          destination: message_create
    kafka:
      binder:
        brokers: "localhost:9092"

server:
  port: 8083

eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
