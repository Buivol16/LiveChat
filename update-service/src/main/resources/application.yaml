spring:
  application:
    name: update-service
  config:
    import: "configserver:http://localhost:8888/"
  datasource:
    url: "jdbc:postgresql://localhost:5433/livechat"
    username: "admin"
    password: "admin"
  cloud:
    function:
      definition: chat-created;message-created;notification-accepted
    stream:
      kafka:
        binder:
          autoCreateTopics: false
      bindings:
        chat-created-in-0:
          destination: chat_create
        message-created-in-0:
          destination: message_create
        notification-accepted-in-0:
          destination: notification_accepted
    kafka:
      binder:
        brokers: "localhost:9092"

eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true